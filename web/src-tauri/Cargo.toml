[package]
name = "gepaw-desktop"
version = "0.1.0"
description = "GE-paw ×ÀÃæ¿Ç (Tauri 2.x)"
authors = ["GE-paw maintainers"]
edition = "2021"
rust-version = "1.77"

# Avoid putting the sidecar or build artefacts inside the parent repo's target dir.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"

# The GE-paw CLI is shipped as a sidecar binary. The Tauri build pipeline
# will look for the platform-specific binary in ./binaries/, e.g.
#   binaries/gepaw-x86_64-pc-windows-msvc.exe  (Windows)
#   binaries/gepaw-x86_64-unknown-linux-gnu     (Linux)
#   binaries/gepaw-x86_64-apple-darwin          (macOS Intel)
#   binaries/gepaw-aarch64-apple-darwin         (macOS Apple Silicon)
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
