# GE-paw single-host deployment (docker compose v2 syntax).
services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: gepaw/api:0.1.0
    container_name: gepaw-api
    restart: unless-stopped
    env_file:
      - deploy/.env
    volumes:
      - gepaw-data:/app/data
      - gepaw-wiki:/app/data/orgs
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: nginx:1.27-alpine
    container_name: gepaw-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  gepaw-data:
  gepaw-wiki:
