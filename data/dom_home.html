:root {
  --bg: #0f0f10;
  --bg-elevated: #181819;
  --bg-overlay: rgba(255, 255, 255, 0.05);
  --bg-hover: rgba(255, 255, 255, 0.07);

  --border-strong: #3a3a40;
  --accent: #10a37f;
  --accent-hover: #0e8a6b;
  --accent-soft: rgba(16, 163, 127, 0.16);
  --danger: #ef4146;
  --danger-soft: rgba(239, 65, 70, 0.16);
  --warning: #d97706;
  --warning-soft: rgba(217, 119, 6, 0.16);
  --ok: #10a37f;
  --ok-soft: rgba(16, 163, 127, 0.16);
  --perm-full: #10a37f;
  --perm-smart: #4f9aff;
  --perm-strict: #d97706;
  --perm-readonly: #b14ee0;
  --left-w: 260px;
  --left-w-collapsed: 48px;
  --right-w: 420px;
  --top-h: 52px;
  --radius: 10px;
  --radius-sm: 6px;
  --radius-pill: 999px;
  --font: "Soehne", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
  --transition: 160ms cubic-bezier(.2,.7,.3,1);
  --shadow-pop: 0 8px 30px rgba(0, 0, 0, 0.45), 0 0 0 1px var(--border);
  --shadow-menu: 0 10px 30px rgba(0, 0, 0, 0.5);
  --shadow-card: 0 1px 0 rgba(255, 255, 255, 0.02) inset, 0 1px 2px rgba(0, 0, 0, 0.2);
}

[data-theme="light"] {
  --bg: #ffffff;
  --bg-elevated: #f7f7f8;
  --bg-overlay: rgba(0, 0, 0, 0.04);
  --bg-hover: rgba(0, 0, 0, 0.06);
  --fg: #1a1a1a;
  --fg-muted: #6e6e80;

  --perm-full: #10a37f;
  --perm-smart: #2563eb;
  --perm-strict: #b86b00;

  --shadow-pop: 0 8px 30px rgba(0, 0, 0, 0.08), 0 0 0 1px var(--border);

* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; padding: 0; }
body {

}

  cursor: pointer;
  transition: var(--transition);
}

button:disabled { opacity: 0.5; cursor: not-allowed; }
input, select, textarea {
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  outline: none;
  transition: var(--transition);
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre { font-family: var(--font-mono); }
pre { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; overflow: auto; }
hr { border: 0; border-top: 1px solid var(--border); margin: 8px 0; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: var(--fg-faint); }
::-webkit-scrollbar-track { background: transparent; }

.app-shell { display: grid; grid-template-rows: var(--top-h) 1fr; height: 100%; }

.topbar {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) minmax(0, 2fr) minmax(220px, 1fr);
  align-items: center;
  gap: 12px;
  padding: 0 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);

  color: var(--fg-muted);

}
.topbar-left, .topbar-right { display: flex; align-items: center; gap: 4px; min-width: 0; }

.topbar-center { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; }
.topbar-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--fg); padding: 0 6px; letter-spacing: 0.1px; }

  border-radius: var(--radius-sm);
  color: var(--fg-muted);
  border: 1px solid transparent;
  transition: var(--transition);
}
.topbar-icon-btn:hover { color: var(--fg); background: var(--bg-hover); border-color: var(--border); }
.topbar-icon-btn:active { transform: scale(0.96); }
.topbar-icon-btn.compact { width: 28px; height: 28px; }
.topbar-icon-btn.ghost { background: transparent; border: 0; }
.topbar-org-pill {

  background: var(--bg-elevated);
}

.thread-header {

.thread-title-btn {

  background: transparent; border: 0; padding: 4px 8px;
  border-radius: var(--radius-sm); color: var(--fg);

  max-width: 100%; min-width: 0;
}
.thread-title-btn:hover { background: var(--bg-hover); }
.thread-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38ch; }

.thread-meta { color: var(--fg-faint); font-size: 12px; }
.thread-rename-input {

}

}
.thread-perm-full { color: var(--perm-full); border-color: var(--perm-full); background: color-mix(in srgb, var(--perm-full) 12%, transparent); }
.thread-perm-smart { color: var(--perm-smart); border-color: var(--perm-smart); background: color-mix(in srgb, var(--perm-smart) 12%, transparent); }
.thread-perm-strict { color: var(--perm-strict); border-color: var(--perm-strict); background: color-mix(in srgb, var(--perm-strict) 12%, transparent); }
.thread-perm-readonly { color: var(--perm-readonly); border-color: var(--perm-readonly); background: color-mix(in srgb, var(--perm-readonly) 12%, transparent); }
.thread-err { font-size: 11px; color: var(--danger); }
.thread-menu { min-width: 220px; }

.dropdown { position: relative; }
.dropdown-menu {
  position: absolute; right: 0; top: calc(100% + 6px);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);

.dropdown-item {

  cursor: pointer;
}
.dropdown-item:hover { background: var(--bg-hover); }

.app-body {

.center-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }

.new-thread-btn {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 8px 12px;
  background: var(--bg-elevated); border: 1px solid var(--border);

.left-item-channel { font-size: 10px; padding: 1px 6px; border-radius: var(--radius-pill); background: var(--bg-elevated); color: var(--fg-faint); border: 1px solid var(--border); }
.left-item-icon { display: inline-flex; align-items: center; color: var(--fg-faint); }
